name: fase-4-ci

on:
  pull_request:
    paths:
      - 'fase-4/**'
      - '.github/workflows/fase-4-*.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: fase-4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  funcoes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fase-4/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fase-4/functions/pom.xml
      - name: Testes e verificação de cobertura
        run: mvn -B -ntp verify

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar Bicep
        run: az bicep build --file fase-4/infra/main.bicep --stdout > /dev/null
      - name: Login no Azure (OIDC)
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file fase-4/infra/main.bicep \
            --parameters adminEmails='${{ secrets.ADMIN_EMAILS_JSON }}' \
            --no-pretty-print --only-show-errors > /dev/null
